<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ConnectHub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar"><a class="brand" href="/">ConnectHub</a></nav>
  <main class="auth-page">
    <form id="loginForm" class="auth-card card">
      <span class="eyebrow">Welcome back</span>
      <h1>Log in</h1>
      <p class="muted">Enter your account details.</p>
      <label>Email<input id="email" type="email" required></label>
      <label>Password<input id="password" type="password" required></label>
      <button class="btn primary full" type="submit">Log in</button>
      <p class="auth-switch">Don't have an account? <a href="/register.html">Register</a></p>
      <p id="message" class="form-message"></p>
    </form>
  </main>
  <script src="/js/auth.js"></script>
</body>
</html>
